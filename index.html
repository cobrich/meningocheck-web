const SYMPTOMS = [
  {id:'fever', label:'Высокая температура', weight:14, danger:true},
  {id:'headache', label:'Сильная головная боль', weight:12},
  {id:'neck', label:'Скованность шеи', weight:18, danger:true},
  {id:'photophobia', label:'Светобоязнь', weight:8},
  {id:'nausea', label:'Тошнота', weight:5},
  {id:'vomiting', label:'Рвота', weight:7},
  {id:'drowsy', label:'Сонливость', weight:8},
  {id:'confusion', label:'Спутанность сознания', weight:16, danger:true},
  {id:'seizures', label:'Судороги', weight:18, danger:true},
  {id:'rash', label:'Сыпь', weight:14},
  {id:'chills', label:'Озноб', weight:4},
  {id:'musclepain', label:'Боль в мышцах', weight:4},
  {id:'jointpain', label:'Боль в суставах', weight:4},
  {id:'coldlimbs', label:'Холодные руки и ноги', weight:8},
  {id:'unconscious', label:'Потеря сознания', weight:20, danger:true},
  {id:'hardwake', label:'Трудно проснуться', weight:14, danger:true},
  {id:'speech', label:'Затруднение речи', weight:10},
  {id:'breathing', label:'Затруднение дыхания', weight:10}
];
const C = { p50:'#EAF3FC', p100:'#F4F9FE', border:'#C3DDF5', border2:'#8FC0EB', mid:'#3C86C7', strong:'#1B5FA0', dark:'#0C4478', darker:'#042C53', muted:'#7FA9D6', green:'#34A876', greenBg:'#E6F7EF' };

let usersDb = {};
let state = { page:'landing', step:0, age:'', gender:'', duration:'', symptoms:{}, other:'', history:[], user:null, pendingEmail:null, pendingName:null, pendingPassword:null, generatedCode:null, authError:null, codeError:null };

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function genCode(){ return String(Math.floor(100000 + Math.random()*900000)); }

function calcRisk(){
  let score=0, dangerCount=0, hits=[];
  SYMPTOMS.forEach(s=>{ if(state.symptoms[s.id]){ score+=s.weight; if(s.danger) dangerCount++; hits.push(s); } });
  let pct = Math.min(100, Math.round(score));
  let emergency = dangerCount>=2 || state.symptoms.neck || state.symptoms.confusion || state.symptoms.seizures || state.symptoms.unconscious;
  hits.sort((a,b)=>b.weight-a.weight);
  return { pct, emergency, top: hits.slice(0,3) };
}
function levelInfo(pct){
  if(pct<=30) return {label:'Низкий риск'};
  if(pct<=60) return {label:'Средний риск'};
  if(pct<=80) return {label:'Высокий риск'};
  return {label:'Критический риск'};
}

function topbar(active){
  const items = [['landing','Главная'],['assessment','Проверка'],['dashboard','Кабинет']];
  return `<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid ${C.border};background:#ffffff;position:sticky;top:0;z-index:10;flex-wrap:wrap;gap:8px;">
    <div style="display:flex;align-items:center;gap:8px;font-weight:700;color:${C.dark};font-size:14px;white-space:nowrap;">
      <img src="${LOGO}" alt="MeningoCheck/Ai" style="height:28px;width:auto;display:block;"/>
      <span>MeningoCheck<span style="color:${C.green};">/Ai</span></span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;font-size:12px;flex-wrap:wrap;">
      ${items.map(([k,l])=>`<span data-nav="${k}" style="cursor:pointer;color:${active===k?C.strong:C.mid};font-weight:${active===k?'700':'400'};white-space:nowrap;">${l}</span>`).join('')}
      ${state.user ? `
        <button data-logout style="background:#fff;color:${C.strong};border:1px solid ${C.border2};padding:5px 12px;border-radius:8px;font-size:12px;white-space:nowrap;">Выйти</button>
      ` : `
        <span data-nav="login" style="cursor:pointer;color:${active==='login'?C.strong:C.mid};white-space:nowrap;">Вход</span>
        <button data-nav="register" style="background:${C.strong};color:#fff;border:none;padding:6px 14px;border-radius:8px;font-size:12px;white-space:nowrap;">Регистрация</button>
      `}
    </div>
  </div>`;
}
function wireNav(container){
  container.querySelectorAll('[data-nav]').forEach(n=>{
    n.onclick = ()=>{ state.page = n.dataset.nav; if(state.page==='assessment') state.step=0; state.authError=null; state.codeError=null; render(); };
  });
  const lo = container.querySelector('[data-logout]');
  if(lo) lo.onclick = ()=>{ state.user=null; state.page='landing'; render(); };
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML='';
  app.appendChild(el(topbar(state.page)));
  const wrap = el(`<div class="page-wrap"></div>`);
  const inner = el(`<div class="content-max" style="padding-top:28px;"></div>`);
  let body;
  if(state.page==='landing') body = viewLanding();
  else if(state.page==='register') body = viewRegister();
  else if(state.page==='verify') body = viewVerify();
  else if(state.page==='login') body = viewLogin();
  else if(state.page==='assessment') body = state.user ? viewAssessment() : viewLoginGate();
  else if(state.page==='result') body = viewResult();
  else body = state.user ? viewDashboard() : viewLoginGate();
  inner.appendChild(body);
  wrap.appendChild(inner);
  app.appendChild(wrap);
  wireNav(app);
}

function card(inner){
  const c = el(`<div style="background:#fff;border-radius:18px;border:1px solid ${C.border};box-shadow:0 4px 18px rgba(4,44,83,0.06);padding:26px 22px;width:100%;"></div>`);
  c.appendChild(inner);
  return c;
}

function viewLanding(){
  const wrap = el(`<div style="width:100%;"></div>`);
  const hero = el(`
    <div style="text-align:center;padding:24px 4px 20px;">
      <img src="${LOGO}" alt="MeningoCheck/Ai" style="height:84px;width:auto;margin:0 auto 16px;display:block;"/>
      <h1 style="font-size:21px;margin-bottom:8px;color:${C.darker};line-height:1.3;font-weight:700;">Meningitis early risk assessment</h1>
      <p style="color:${C.mid};margin:0 auto 20px;font-size:13px;line-height:1.6;">Оцените риск развития менингита на основании введённых симптомов. Только для образовательных целей — не диагноз.</p>
      <button id="start" style="background:${C.strong};color:#fff;border:none;padding:12px 26px;border-radius:10px;font-size:14px;font-weight:700;">Начать проверку</button>
    </div>
  `);
  wrap.appendChild(card(hero));
  const w = wrap;
  w.querySelector('#start').onclick = ()=>{ state.page = state.user ? 'assessment' : 'register'; state.step=0; render(); };
  return w;
}

function viewLoginGate(){
  const target = state.page;
  const inner = el(`
    <div style="text-align:center;padding:6px 2px;">
      <i class="ti ti-lock" style="font-size:26px;color:${C.strong}"></i>
      <p style="color:${C.dark};font-size:13px;margin:12px 0 16px;line-height:1.6;">Чтобы пройти проверку и сохранить результат, войдите или зарегистрируйтесь.</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
        <button id="toLogin" style="background:#fff;color:${C.strong};border:1px solid ${C.border2};padding:9px 18px;border-radius:10px;font-size:12px;">Войти</button>
        <button id="toReg" style="background:${C.strong};color:#fff;border:none;padding:9px 18px;border-radius:10px;font-size:12px;">Регистрация</button>
      </div>
    </div>
  `);
  const w = card(inner);
  w.querySelector('#toLogin').onclick = ()=>{ state.page='login'; render(); };
  w.querySelector('#toReg').onclick = ()=>{ state.page='register'; render(); };
  return w;
}

function viewRegister(){
  const inner = el(`
    <div style="width:100%;">
      <h3 style="color:${C.darker};margin-bottom:2px;font-size:17px;font-weight:700;">Создать аккаунт</h3>
      <p style="font-size:11px;color:${C.muted};margin-bottom:16px;">Регистрация через email — мы вышлем код подтверждения</p>
      <div style="display:grid;gap:10px;margin-bottom:6px;">
        <div><label style="font-size:11px;color:${C.mid};">Имя</label><input id="name" type="text" placeholder="Например, Айгерим"/></div>
        <div><label style="font-size:11px;color:${C.mid};">Email</label><input id="email" type="email" placeholder="name@example.com"/></div>
        <div><label style="font-size:11px;color:${C.mid};">Пароль</label><input id="password" type="password" placeholder="Минимум 8 символов"/></div>
      </div>
      ${state.authError ? `<p style="color:#B3261E;font-size:11px;margin:6px 0;">${state.authError}</p>` : ''}
      <button id="submit" style="width:100%;background:${C.strong};color:#fff;border:none;padding:11px;border-radius:10px;font-size:13px;font-weight:700;margin-top:10px;">Отправить код на почту</button>
      <p style="font-size:11px;color:${C.mid};margin-top:14px;text-align:center;">Уже есть аккаунт? <span data-nav="login" style="color:${C.strong};cursor:pointer;font-weight:600;">Войти</span></p>
    </div>
  `);
  const w = card(inner);
  wireNav(w);
  w.querySelector('#submit').onclick = ()=>{
    const name = w.querySelector('#name').value.trim();
    const email = w.querySelector('#email').value.trim().toLowerCase();
    const password = w.querySelector('#password').value;
    if(!name || !email || !email.includes('@') || password.length<8){
      state.authError = 'Проверьте: имя, корректный email и пароль от 8 символов.';
      render(); return;
    }
    if(usersDb[email] && usersDb[email].verified){
      state.authError = 'Пользователь с таким email уже зарегистрирован.';
      render(); return;
    }
    const code = genCode();
    usersDb[email] = { name, email, password, verified:false, code };
    state.pendingEmail = email;
    state.pendingName = name;
    state.generatedCode = code;
    state.authError = null;
    state.codeError = null;
    state.page='verify';
    render();
  };
  return w;
}

function viewVerify(){
  const email = state.pendingEmail;
  const inner = el(`
    <div style="text-align:center;width:100%;">
      <i class="ti ti-mail" style="font-size:24px;color:${C.strong}"></i>
      <p style="color:${C.dark};font-weight:700;margin:10px 0 4px;font-size:14px;">Введите код подтверждения</p>
      <p style="font-size:11px;color:${C.mid};margin-bottom:6px;line-height:1.6;">Мы отправили 6-значный код на ${email}.</p>
      <p style="font-size:11px;color:${C.muted};margin-bottom:16px;line-height:1.6;background:${C.p100};border-radius:8px;padding:8px;">Демо-режим без реального email-сервера: код показан здесь, чтобы вы могли проверить работу формы — <b style="color:${C.strong};letter-spacing:1px;">${state.generatedCode}</b></p>
      <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="000000" style="text-align:center;letter-spacing:6px;font-size:18px;font-weight:700;max-width:200px;margin:0 auto 8px;"/>
      ${state.codeError ? `<p style="color:#B3261E;font-size:11px;margin:4px 0 8px;">${state.codeError}</p>` : ''}
      <button id="confirm" style="background:${C.strong};color:#fff;border:none;padding:9px 20px;border-radius:10px;font-size:13px;font-weight:700;margin-top:6px;">Подтвердить</button>
      <p style="font-size:11px;color:${C.mid};margin-top:12px;">Не пришёл код? <span id="resend" style="color:${C.strong};cursor:pointer;font-weight:600;">Отправить снова</span></p>
    </div>
  `);
  const w = card(inner);
  w.querySelector('#confirm').onclick = ()=>{
    const entered = w.querySelector('#code').value.trim();
    if(entered !== usersDb[email].code){
      state.codeError = 'Неверный код. Попробуйте ещё раз.';
      render(); return;
    }
    usersDb[email].verified = true;
    state.user = { name: usersDb[email].name, email };
    state.codeError = null;
    state.page='assessment'; state.step=0;
    render();
  };
  w.querySelector('#resend').onclick = ()=>{
    const code = genCode();
    usersDb[email].code = code;
    state.generatedCode = code;
    state.codeError = null;
    render();
  };
  return w;
}

function viewLogin(){
  const inner = el(`
    <div style="width:100%;">
      <h3 style="color:${C.darker};margin-bottom:16px;font-size:17px;font-weight:700;">Вход</h3>
      <div style="display:grid;gap:10px;">
        <div><label style="font-size:11px;color:${C.mid};">Email</label><input id="email" type="email" placeholder="name@example.com"/></div>
        <div><label style="font-size:11px;color:${C.mid};">Пароль</label><input id="password" type="password"/></div>
      </div>
      ${state.authError ? `<p style="color:#B3261E;font-size:11px;margin:8px 0 0;">${state.authError}</p>` : ''}
      <button id="submit" style="width:100%;background:${C.strong};color:#fff;border:none;padding:11px;border-radius:10px;font-size:13px;font-weight:700;margin-top:14px;">Войти</button>
      <p style="font-size:11px;color:${C.mid};margin-top:14px;text-align:center;">Нет аккаунта? <span data-nav="register" style="color:${C.strong};cursor:pointer;font-weight:600;">Зарегистрироваться</span></p>
    </div>
  `);
  const w = card(inner);
  wireNav(w);
  w.querySelector('#submit').onclick = ()=>{
    const email = w.querySelector('#email').value.trim().toLowerCase();
    const password = w.querySelector('#password').value;
    const u = usersDb[email];
    if(!u || u.password!==password){
      state.authError = 'Неверный email или пароль.';
      render(); return;
    }
    if(!u.verified){
      state.authError = 'Email ещё не подтверждён. Проверьте почту.';
      render(); return;
    }
    state.user = { name:u.name, email };
    state.authError=null;
    state.page='dashboard';
    render();
  };
  return w;
}

function viewAssessment(){
  return state.step===0 ? card(stepDemo()) : card(stepSymptoms());
}

function stepDemo(){
  const w = el(`
    <div style="width:100%;">
      <p style="font-size:11px;color:${C.muted};margin-bottom:4px;">Шаг 1 из 2</p>
      <div style="height:4px;background:${C.p50};border-radius:2px;margin-bottom:16px;overflow:hidden;"><div style="width:50%;height:100%;background:${C.strong};"></div></div>
      <h3 style="color:${C.darker};margin-bottom:12px;font-size:16px;font-weight:700;">Основная информация</h3>
      <div style="display:grid;gap:10px;margin-bottom:18px;">
        <div><label style="font-size:11px;color:${C.mid};">Возраст</label><input id="age" type="number" value="${state.age}"/></div>
        <div><label style="font-size:11px;color:${C.mid};">Пол</label><select id="gender">
          <option value="">Выберите</option>
          <option value="female" ${state.gender==='female'?'selected':''}>Женский</option>
          <option value="male" ${state.gender==='male'?'selected':''}>Мужской</option>
          <option value="other" ${state.gender==='other'?'selected':''}>Другой</option>
        </select></div>
        <div><label style="font-size:11px;color:${C.mid};">Дней с начала симптомов</label><input id="duration" type="number" value="${state.duration}"/></div>
      </div>
      <div style="display:flex;justify-content:flex-end;">
        <button id="next" style="background:${C.strong};color:#fff;border:none;padding:9px 20px;border-radius:10px;font-size:13px;font-weight:600;">Далее</button>
      </div>
    </div>
  `);
  w.querySelector('#next').onclick = ()=>{
    state.age = w.querySelector('#age').value;
    state.gender = w.querySelector('#gender').value;
    state.duration = w.querySelector('#duration').value;
    state.step=1; render();
  };
  return w;
}

function stepSymptoms(){
  const w = el(`
    <div style="width:100%;">
      <p style="font-size:11px;color:${C.muted};margin-bottom:4px;">Шаг 2 из 2</p>
      <div style="height:4px;background:${C.p50};border-radius:2px;margin-bottom:16px;overflow:hidden;"><div style="width:100%;height:100%;background:${C.strong};"></div></div>
      <h3 style="color:${C.darker};margin-bottom:12px;font-size:16px;font-weight:700;">Отметьте симптомы</h3>
      <div id="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:7px;margin-bottom:14px;width:100%;"></div>
      <label style="font-size:11px;color:${C.mid};">Другие симптомы</label>
      <textarea id="other" rows="2" style="margin:6px 0 18px;">${state.other}</textarea>
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;">
        <button id="back" style="background:#fff;color:${C.strong};border:1px solid ${C.border2};padding:9px 20px;border-radius:10px;font-size:13px;">Назад</button>
        <button id="finish" style="background:${C.strong};color:#fff;border:none;padding:9px 20px;border-radius:10px;font-size:13px;font-weight:600;">Показать результат</button>
      </div>
    </div>
  `);
  const grid = w.querySelector('#grid');
  SYMPTOMS.forEach(s=>{
    const checked = !!state.symptoms[s.id];
    const row = el(`
      <label style="display:flex;align-items:center;gap:6px;padding:8px 9px;border:1px solid ${checked?C.border2:C.border};background:${checked?C.p50:'#fff'};border-radius:9px;cursor:pointer;font-size:12px;color:${checked?C.dark:C.mid};line-height:1.3;">
        <input type="checkbox" id="chk-${s.id}" style="width:auto;flex-shrink:0;margin:0;" ${checked?'checked':''}/><span>${s.label}</span>
      </label>
    `);
    row.querySelector('input').onchange = (e)=>{ state.symptoms[s.id]=e.target.checked; render(); };
    grid.appendChild(row);
  });
  w.querySelector('#back').onclick = ()=>{ state.step=0; render(); };
  w.querySelector('#finish').onclick = ()=>{
    state.other = w.querySelector('#other').value;
    const r = calcRisk();
    state.history.unshift({date:'сегодня', pct:r.pct});
    state.page='result'; render();
  };
  return w;
}

function viewResult(){
  const r = calcRisk();
  const lvl = levelInfo(r.pct);
  const circ = 2*Math.PI*54, dash=(r.pct/100)*circ;
  const inner = el(`
    <div style="width:100%;">
      ${r.emergency ? `<div style="background:#FDEDEC;border:1px solid #F2A9A2;border-radius:12px;padding:13px 14px;margin-bottom:16px;">
        <p style="color:#A32D2D;font-weight:700;margin:0 0 4px;font-size:13px;"><i class="ti ti-alert-triangle" style="margin-right:5px;vertical-align:-2px;"></i>Возможное тяжёлое заболевание</p>
        <p style="color:#A32D2D;font-size:12px;margin:0;line-height:1.5;">Немедленно обратитесь за экстренной медицинской помощью. Данная оценка не является диагнозом.</p>
      </div>` : ''}
      <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px;">
        <svg width="120" height="120" viewBox="0 0 140 140" style="flex-shrink:0;">
          <circle cx="70" cy="70" r="54" fill="none" stroke="${C.p50}" stroke-width="12"/>
          <circle cx="70" cy="70" r="54" fill="none" stroke="${C.strong}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${dash} ${circ}" transform="rotate(-90 70 70)"/>
          <text x="70" y="66" text-anchor="middle" font-size="24" font-weight="700" fill="${C.darker}">${r.pct}%</text>
          <text x="70" y="85" text-anchor="middle" font-size="10" fill="${C.mid}">риск</text>
        </svg>
        <div style="min-width:0;flex:1;">
          <span style="background:${C.p50};color:${C.dark};font-size:12px;padding:4px 11px;border-radius:8px;font-weight:700;display:inline-block;">${lvl.label}</span>
          <p style="color:${C.mid};font-size:12px;margin-top:9px;line-height:1.6;">${r.top.length ? 'Наибольшее влияние оказали: '+r.top.map(s=>s.label.toLowerCase()).join(', ')+'.' : 'Симптомы не выбраны.'}</p>
        </div>
      </div>
      <div style="background:${C.p100};border-radius:12px;padding:13px 14px;margin-bottom:16px;">
        <p style="font-weight:700;margin:0 0 5px;font-size:12px;color:${C.dark};">Рекомендации</p>
        <p style="font-size:12px;color:${C.mid};margin:0;line-height:1.6;">${r.emergency ? 'Обратитесь в скорую помощь немедленно.' : r.pct>30 ? 'Рекомендуется в ближайшее время обратиться к врачу.' : 'Наблюдайте за состоянием и при ухудшении обратитесь к врачу.'}</p>
      </div>
      <p style="font-size:11px;color:${C.muted};margin-bottom:16px;line-height:1.5;">Это предварительная оценка, а не медицинский диагноз.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button id="retry" style="background:#fff;color:${C.strong};border:1px solid ${C.border2};padding:9px 16px;border-radius:10px;font-size:12px;">Пройти ещё раз</button>
        <button id="toDash" style="background:${C.strong};color:#fff;border:none;padding:9px 16px;border-radius:10px;font-size:12px;font-weight:600;">Сохранить в кабинет</button>
      </div>
    </div>
  `);
  const w = card(inner);
  wireNav(w);
  w.querySelector('#retry').onclick = ()=>{ state.step=0; state.symptoms={}; state.other=''; state.page='assessment'; render(); };
  w.querySelector('#toDash').onclick = ()=>{ state.page='dashboard'; render(); };
  return w;
}

function viewDashboard(){
  const last = state.history[0];
  const inner = el(`
    <div style="width:100%;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;">
        <div style="width:38px;height:38px;border-radius:50%;background:${C.p50};display:flex;align-items:center;justify-content:center;font-weight:700;color:${C.strong};font-size:12px;flex-shrink:0;">${(state.user.name||'?').slice(0,2).toUpperCase()}</div>
        <div style="min-width:0;"><p style="font-weight:700;margin:0;font-size:13px;color:${C.darker};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${state.user.name}</p><p style="font-size:11px;color:${C.muted};margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${state.user.email}</p></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:18px;">
        <div style="background:${C.p100};border-radius:10px;padding:11px;"><p style="font-size:10px;color:${C.mid};margin:0 0 3px;">Проверок</p><p style="font-size:18px;font-weight:700;margin:0;color:${C.darker};">${state.history.length}</p></div>
        <div style="background:${C.p100};border-radius:10px;padding:11px;"><p style="font-size:10px;color:${C.mid};margin:0 0 3px;">Последний риск</p><p style="font-size:18px;font-weight:700;margin:0;color:${C.strong};">${last?last.pct+'%':'-'}</p></div>
      </div>
      <p style="font-weight:700;font-size:12px;margin-bottom:8px;color:${C.dark};">История проверок</p>
      <div>
        ${state.history.length ? state.history.map(h=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:8px 0;border-top:1px solid ${C.p50};"><span style="color:${C.mid};">${h.date}</span><span style="color:${C.strong};font-weight:700;">${h.pct}%</span></div>`).join('') : `<p style="font-size:11px;color:${C.muted};">Вы ещё не проходили проверку.</p>`}
      </div>
    </div>
  `);
  return card(inner);
}

render();
</script>
</body>
</html>
